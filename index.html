<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Countdown</h1>

        <div class="timer">
            <div><span id="jam">24</span><p>Hours</p></div>
            <div><span id="menit">00</span><p>Mins</p></div>
            <div><span id="detik">00</span><p>Secs</p></div>
        </div>

        <div class="buttons">
            <button id="btnStart">Start</button>
            <button id="btnReset">Reset</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
